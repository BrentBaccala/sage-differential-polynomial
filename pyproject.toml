[build-system]
requires = ["setuptools>=61", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-differential-polynomial"
version = "0.1.0"
description = "Native Sage differential-polynomial ring (DifferentialPolynomialRing / DifferentialPolynomial) backed by BLAD via a term-walk Cython binding"
authors = [{name = "Brent Baccala (AI assistant)", email = "cosine@freesoft.org"}]
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
